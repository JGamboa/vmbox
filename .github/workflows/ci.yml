name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: guest-agent/go.mod
          cache-dependency-path: guest-agent/go.sum
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Unit tests
        run: scripts/test.sh
      - name: Build app
        run: scripts/build.sh
