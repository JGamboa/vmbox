name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: guest-agent/go.mod
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Unit tests
        run: scripts/test.sh
      - name: Package
        run: scripts/package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/VMBox.zip \
            --title "VMBox $GITHUB_REF_NAME" --generate-notes \
            --notes "Unsigned build: after moving VMBox.app to /Applications run \`xattr -dr com.apple.quarantine /Applications/VMBox.app\`. See README."
